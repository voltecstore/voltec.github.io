<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Voltec</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Voltec</div>
            <ul class="nav-links">
                <li><a href="index.html">Ev</a></li>
                <li><a href="shop.html">Mağaza</a></li>
                <li class="dropdown"></li>
                <li><a href="#about">Haqqımızda</a></li>
                <li><a href="#contact">Əlaqə</a></li>
                <li><a href="cart.html" class="cart-link">Səbət (<span id="cart-count">0</span>)</a></li>
                <li class="theme-switch">
                    <input type="checkbox" id="theme-toggle-checkbox">
                    <label for="theme-toggle-checkbox" class="toggle-label"></label>
                </li>
            </ul>
        </nav>
    </header>

    <section class="cart-section">
        <h2>Səbət</h2>
        <div id="cart-items"></div>
        <p>Ümumi: ₼<span id="cart-total">0.00</span></p>
        <button id="checkout-button">Tamamla</button>
    </section>

    <footer>
        <div class="social-links">
            <a href="#">Instagram</a>
            <a href="#">TikTok</a>
        </div>
        <div class="newsletter">
            <input type="email" placeholder="Subscribe to newsletter">
            <button>Abunə Ol</button>
        </div>
        <p>&copy; 2025 Voltec. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
