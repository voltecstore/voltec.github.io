<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltec - Mağaza</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Voltec</div>
            <ul class="nav-links">
                <li><a href="index.html">Ev</a></li>
                <li><a href="shop.html">Mağaza</a></li>
                <li><a href="#about">Haqqımızda</a></li>
                <li><a href="#contact">Əlaqə</a></li>
                <li><a href="cart.html" class="cart-link">Səbət (<span id="cart-count">0</span>)</a></li>
                <li class="theme-switch">
                    <input type="checkbox" id="theme-toggle-checkbox">
                    <label for="theme-toggle-checkbox" class="toggle-label"></label>
                </li>
            </ul>
        </nav>
    </header>

    <section class="shop-section">
        <h2>Mağaza</h2>
        <div class="filters">
            <select id="category-filter">
                <option value="">Kategoriya</option>
                <option value="keyboards">Klaviatura</option>
                <option value="mice">Sıçan</option>
                <option value="headsets">Headset</option>
            </select>
            <select id="price-filter">
                <option value="">Qiymət</option>
                <option value="0-85">0 ₼ - 85 ₼</option>
                <option value="85-170">85 ₼ - 170 ₼</option>
                <option value="170+">170 ₼+</option>
            </select>
            <select id="rating-filter">
                <option value="">Reytinq</option>
                <option value="4">4+ </option>
                <option value="4.5">4.5+</option>
            </select>
        </div>
        <div id="product-grid"></div>
    </section>

    <!-- Ürün Detay Modal (index.html ile aynı) -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div class="modal-gallery">
                <img id="main-image" src="" alt="Product Image">
                <div id="thumbnail-gallery" class="thumbnail-gallery"></div>
            </div>
            <div class="modal-video">
                <video id="product-video" controls>
                    <source id="video-source" src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="modal-details">
                <h3 id="modal-product-name"></h3>
                <p id="modal-product-price"></p>
                <p id="modal-product-description"></p>
                <button id="add-to-cart-modal" class="add-to-cart">Səbətə Əlavə Et</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
